name: EGX100 Technical Scan

on:
  workflow_dispatch:
  push:
    branches:
      - feature/egx100-technical-scanner
  schedule:
    - cron: "30 15 * * 0-4"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run EGX100 technical scan
        run: python technical_scan.py
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: egx100-technical-scan
          path: |
            output/egx100_technical_scan_*.csv
            output/egx100_technical_scan_*.xlsx
      - name: Commit latest scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Update EGX100 technical scan"
          git push
      - name: Send Excel report to Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE=$(ls -t output/egx100_technical_scan_*.xlsx | head -1)
          DATE=$(basename "$FILE" | sed -E 's/[^0-9]*([0-9]{4}-[0-9]{2}-[0-9]{2})\.xlsx/\1/')
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${FILE}" \
            -F "caption=EGX100 Technical Scan — ${DATE} | RSI • CCI • EMA 50/200 • Patterns • Order Blocks"
