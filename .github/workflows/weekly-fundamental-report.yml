name: EGX Weekly Fundamental Report

on:
  push:
    branches: ["main","v3-development"]
    paths-ignore:
      - "data/**"
      - "output/**"
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch: {}
  pull_request:
    branches: ["v3-development"]

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas lxml openpyxl

      - name: Validate Python modules
        run: python -m py_compile config.py scraper.py v2_engine.py v3_engine.py universe_v3.py history_store_v3.py backtest_v3.py excel_report_v3.py report_v3.py main.py telegram_sender.py

      - name: Run weekly scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit V3 historical state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history_v3.csv data/universe_history.csv
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: store EGX V3 weekly research history"
            git push
          fi

      - name: Upload generated V3 report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: egx-v3-report-${{ github.run_number }}
          path: output/egx_weekly_v3_report_*.xlsx
          if-no-files-found: error
          retention-days: 90
