name: EGX Weekly Fundamental Report

on:
  push:
    branches: ["main"]
  schedule:
    # Fridays 16:00 UTC = 18:00 Cairo (after EGX close, adjust for DST as needed)
    - cron: "0 16 * * 5"
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas lxml openpyxl

      - name: Run weekly scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
